limit_req_zone $binary_remote_addr zone=sofamate_auth:1m rate=12r/m;
limit_req_zone $binary_remote_addr zone=sofamate_api:1m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=sofamate_connections:1m;
log_format sofamate_privacy '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
server {
    listen 80;
    listen [::]:80;
    server_name sofamate.aveniqa.com;
    location ^~ /.well-known/acme-challenge/ { root /srv/sofamate/acme; }
    location / { return 301 https://sofamate.aveniqa.com$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name sofamate.aveniqa.com;
    ssl_certificate /etc/sofamate/letsencrypt/live/sofamate.aveniqa.com/fullchain.pem;
    ssl_certificate_key /etc/sofamate/letsencrypt/live/sofamate.aveniqa.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /srv/sofamate/current/site;
    index index.html;
    access_log /var/log/nginx/sofamate-access.log sofamate_privacy;
    error_log /var/log/nginx/sofamate-error.log warn;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    client_max_body_size 1025m;
    client_body_timeout 90s;
    location = /health {
        proxy_pass http://127.0.0.1:47832;
        proxy_set_header Host $host;
    }
    location ^~ /v1/auth/ {
        limit_req zone=sofamate_auth burst=20 nodelay;
        limit_req_status 429;
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:47832;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 45s;
        proxy_hide_header Content-Security-Policy;
    }
    location = /v1/auth/desktop/poll {
        limit_req zone=sofamate_api burst=10 nodelay;
        proxy_pass http://127.0.0.1:47832;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location ^~ /v1/admin/ { return 404; }
    location /v1/ {
        limit_req zone=sofamate_api burst=20 nodelay;
        limit_req_status 429;
        limit_conn sofamate_connections 4;
        proxy_pass http://127.0.0.1:47832;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        limit_rate 4m;
    }
    location /wallpaper/ {
        proxy_pass http://127.0.0.1:47832;
        proxy_set_header Host $host;
        proxy_hide_header Content-Security-Policy;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; base-uri 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
    }
    location /assets/ { expires 1h; try_files $uri =404; }
    location / { try_files $uri $uri/ $uri.html =404; }
    location ~ /\. { deny all; }
}

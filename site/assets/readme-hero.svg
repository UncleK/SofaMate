<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc"><title id="title">SofaMate — A little room for everyday life.</title><desc id="desc">A warm charcoal and sand editorial layout introducing the lightweight Windows video wallpaper app.</desc><defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#8b7154"/><stop offset="1" stop-color="#3d3931"/></linearGradient><radialGradient id="light"><stop stop-color="#c9ab7f" stop-opacity=".1"/><stop offset="1" stop-color="#c9ab7f" stop-opacity="0"/></radialGradient><clipPath id="view"><rect x="985" y="122" width="470" height="295" rx="12"/></clipPath></defs><rect width="1600" height="620" rx="22" fill="#242320"/><circle cx="1230" cy="270" r="340" fill="url(#light)"/><path d="M72 92H1528M72 538H1528" stroke="#cbb490" stroke-opacity=".14"/><text x="76" y="64" fill="#f1eade" font-family="Arial,sans-serif" font-size="30" font-weight="600" letter-spacing="-1">SofaMate</text><text x="1370" y="61" fill="#c9b491" font-family="Arial,sans-serif" font-size="11" letter-spacing="3">WINDOWS / BETA</text><text x="76" y="160" fill="#c9b491" font-family="Arial,sans-serif" font-size="12" letter-spacing="3">YOUR DESKTOP, A LITTLE MORE ALIVE.</text><text x="72" y="266" fill="#f0eade" font-family="Georgia,serif" font-size="76" letter-spacing="-3">A little room for</text><text x="72" y="354" fill="#cfb692" font-family="Georgia,serif" font-size="80" font-style="italic" letter-spacing="-3">everyday life.</text><text x="77" y="414" fill="#ada496" font-family="Arial,sans-serif" font-size="18">Turn your favorite videos into a place that feels like you.</text><rect x="76" y="454" width="201" height="42" rx="6" fill="#cdb492"/><text x="102" y="481" fill="#29251f" font-family="Arial,sans-serif" font-size="13">MAKE YOURSELF AT HOME</text><circle cx="1230" cy="270" r="242" fill="none" stroke="#beaa8914"/><circle cx="1230" cy="270" r="285" fill="none" stroke="#beaa8910"/><rect x="965" y="100" width="510" height="360" rx="18" fill="#302c27" stroke="#b79b6f" stroke-opacity=".35"/><g clip-path="url(#view)"><rect x="985" y="122" width="470" height="295" fill="url(#sky)"/><circle cx="1328" cy="204" r="49" fill="#dac1a0"/><path d="M965 323Q1060 210 1196 319T1490 285V432H965" fill="#4c4940"/><path d="M965 378Q1110 289 1236 367T1490 337V432H965" fill="#34372f"/><path d="M965 426Q1100 365 1290 410T1490 403V432H965" fill="#272c26"/></g><circle cx="1218" cy="438" r="3" fill="#cdb492"/><path d="M1104 486h235m-153-25-8 25m84-25 8 25" fill="none" stroke="#8f806c" stroke-width="2"/><text x="990" y="512" fill="#9b8e7c" font-family="Arial,sans-serif" font-size="10" letter-spacing="2">A QUIETER KIND OF SCREEN TIME.</text><text x="76" y="582" fill="#a39989" font-family="Arial,sans-serif" font-size="12" letter-spacing="1">IMPORT. PREVIEW. MAKE IT YOURS.</text><text x="1138" y="582" fill="#a39989" font-family="Arial,sans-serif" font-size="12" letter-spacing="1">TAURI + WEBVIEW2  /  LOCAL FIRST</text></svg>
